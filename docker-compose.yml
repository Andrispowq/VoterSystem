
services:
  db:
    image: postgres:17.4
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./postgreinit/:/docker-entrypoint-initdb.d/
      - ./data/db/:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d VoterSystem" ]
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
    profiles: [prod]
    networks:
      - votersystem-internal-network
      
  db-dev:
    image: postgres:17.4
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./postgreinit/:/docker-entrypoint-initdb.d/
      - ./data/db/:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d VoterSystem" ]
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
    profiles: [only-db]
    ports:
      - "5432:5432"
    networks:
      - votersystem-internal-network
  
  
  webapi:
    build:
      context: .
      dockerfile: VoterSystem.WebAPI/Dockerfile
    container_name: webapi
    ports:
      - "6900:6900"
    environment:
      - ASPNETCORE_URLS=http://+:6900
    restart: unless-stopped
    depends_on:
       db:
         condition: service_healthy
    env_file:
      - .env
    profiles: [prod]
    networks:
      - votersystem-internal-network

  web:
    build:
      context: .
      dockerfile: VoterSystem.Web/Dockerfile
      args:
        API_HTTP: ${API_HTTP}
        API_HTTPS: ${API_HTTPS}
        WEB_HTTP: ${WEB_HTTP}
        WEB_HTTPS: ${WEB_HTTPS}
        ADMIN_HTTP: ${ADMIN_HTTP}
        ADMIN_HTTPS: ${ADMIN_HTTPS}
    container_name: web
    ports:
      - "6901:80"
    environment:
      - ASPNETCORE_URLS=http://+:6901
    restart: unless-stopped
    depends_on:
       db:
         condition: service_healthy
    env_file:
      - .env
    profiles: [prod]
    networks:
      - votersystem-internal-network

  admin:
    build:
      context: .
      dockerfile: VoterSystem.Web.Admin/Dockerfile
      args:
        API_HTTP: ${API_HTTP}
        API_HTTPS: ${API_HTTPS}
        WEB_HTTP: ${WEB_HTTP}
        WEB_HTTPS: ${WEB_HTTPS}
        ADMIN_HTTP: ${ADMIN_HTTP}
        ADMIN_HTTPS: ${ADMIN_HTTPS}
    container_name: admin
    ports:
      - "6902:80"
    environment:
      - ASPNETCORE_URLS=http://+:6902
    restart: unless-stopped
    depends_on:
       db:
         condition: service_healthy
    env_file:
      - .env
    profiles: [prod]
    networks:
      - votersystem-internal-network
  
  # EMAIL
  mailhog:
    extends:
      file: ./docker/email-services.yml
      service: mailhog-base
    profiles: [only-db]
    networks:
      - votersystem-internal-network

  smtp-relay:
    extends:
      file: ./docker/email-services.yml
      service: smtp-relay-base
    profiles: [only-db, prod]
    networks:
      - votersystem-internal-network

  # Redis
  redis-dev:
    extends:
      file: ./docker/messaging-services.yml
      service: redis-base
    ports:
      - "6379:6379"
    profiles: [only-db]
    networks:
      - votersystem-internal-network

  redis:
    extends:
      file: ./docker/messaging-services.yml
      service: redis-base
    profiles: [prod]
    networks:
      - votersystem-internal-network
        
  idp:
    image: kenchan0130/simplesamlphp
    container_name: idp
    ports:
      - "8080:8080"
    environment:
      SIMPLESAMLPHP_SP_ENTITY_ID: https://localhost:6910
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: https://localhost:6910/Saml2/Acs
      SIMPLESAMLPHP_SP_SINGLE_LOGOUT_SERVICE: https://localhost:6910/Saml2/Logout
    profiles: [only-db]
    networks:
      - votersystem-internal-network

networks:
  votersystem-internal-network:
     name: votersystem_internal_network
